<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Signed bot identity and structured errors for agent-friendly websites</title>
  <desc id="desc">A clean editorial thumbnail showing a verified agent, a website gateway, and a structured problem details card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#1b2550"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2d64"/>
      <stop offset="100%" stop-color="#263b7a"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fe7ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="120" fill="#12204a" opacity="0.45"/>
  <circle cx="710" cy="380" r="150" fill="#271455" opacity="0.35"/>

  <path d="M120 300 C210 240, 290 230, 365 225" stroke="#3dd9ff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M435 225 C510 230, 595 250, 680 300" stroke="#8b5cf6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <g transform="translate(78 238)">
    <circle cx="0" cy="0" r="54" fill="#0f1a3d" stroke="#57e5ff" stroke-width="4"/>
    <circle cx="0" cy="-16" r="16" fill="#d7f7ff"/>
    <rect x="-24" y="8" width="48" height="30" rx="15" fill="#d7f7ff"/>
    <circle cx="38" cy="-34" r="16" fill="#153b78" stroke="#79f2c0" stroke-width="3"/>
    <path d="M31 -34 l5 6 10 -12" fill="none" stroke="#79f2c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(330 120)">
    <rect x="0" y="0" width="140" height="210" rx="26" fill="#111c44" stroke="url(#gate)" stroke-width="6" filter="url(#glow)"/>
    <rect x="26" y="24" width="88" height="24" rx="12" fill="#5eead4" opacity="0.95"/>
    <rect x="38" y="70" width="64" height="102" rx="18" fill="#0d1430" stroke="#6fe7ff" stroke-width="4"/>
    <path d="M70 110 l18 18 30 -34" fill="none" stroke="#79f2c0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(560 150)">
    <rect x="0" y="0" width="168" height="132" rx="22" fill="url(#card)" stroke="#a78bfa" stroke-width="4"/>
    <circle cx="36" cy="38" r="16" fill="#f59e0b"/>
    <rect x="67" y="26" width="72" height="12" rx="6" fill="#dbeafe" opacity="0.95"/>
    <rect x="24" y="74" width="120" height="12" rx="6" fill="#9fb5ff" opacity="0.9"/>
    <rect x="24" y="98" width="92" height="12" rx="6" fill="#9fb5ff" opacity="0.55"/>
  </g>
</svg>
