<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="A practical cyber agent control loop from request to evidence and review"><rect width="1200" height="760" fill="#f8fafc"/><text x="70" y="82" font-family="Inter,Arial" font-size="42" font-weight="800" fill="#0f172a">A practical cyber-agent control loop</text><text x="70" y="122" font-family="Inter,Arial" font-size="21" fill="#475569">Defensive capability gets safer when every action is scoped, reviewed, and logged.</text><defs><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity=".14"/></filter></defs><g font-family="Inter,Arial" filter="url(#s)"><rect x="90" y="210" width="240" height="106" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="210" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">1. Authorized task</text><text x="210" y="284" text-anchor="middle" font-size="17" fill="#1e40af">repo, issue, scope</text><rect x="480" y="210" width="240" height="106" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="600" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">2. Sandbox run</text><text x="600" y="284" text-anchor="middle" font-size="17" fill="#5b21b6">commands + network policy</text><rect x="870" y="210" width="240" height="106" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="990" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#78350f">3. Approval gate</text><text x="990" y="284" text-anchor="middle" font-size="17" fill="#92400e">risky actions pause</text><rect x="870" y="460" width="240" height="106" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="990" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#14532d">4. Evidence bundle</text><text x="990" y="534" text-anchor="middle" font-size="17" fill="#166534">diffs, tests, citations</text><rect x="480" y="460" width="240" height="106" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="600" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#0c4a6e">5. Human review</text><text x="600" y="534" text-anchor="middle" font-size="17" fill="#075985">merge, reject, revise</text><rect x="90" y="460" width="240" height="106" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="210" y="502" text-anchor="middle" font-size="22" font-weight="700" fill="#7f1d1d">6. Regression memory</text><text x="210" y="534" text-anchor="middle" font-size="17" fill="#991b1b">failures become tests</text></g><g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round"><path d="M335 263h138"/><path d="M725 263h138"/><path d="M990 322v132"/><path d="M864 513H728"/><path d="M474 513H338"/><path d="M210 454V325"/></g><g fill="#64748b"><path d="M470 263l-16-10v20z"/><path d="M860 263l-16-10v20z"/><path d="M990 450l-10-16h20z"/><path d="M732 513l16-10v20z"/><path d="M342 513l16-10v20z"/><path d="M210 329l-10 16h20z"/></g><rect x="210" y="648" width="780" height="46" rx="23" fill="#0f172a"/><text x="600" y="678" text-anchor="middle" font-family="Inter,Arial" font-size="20" fill="#e2e8f0">The goal is faster defense with better accountability, not unbounded autonomy.</text></svg>