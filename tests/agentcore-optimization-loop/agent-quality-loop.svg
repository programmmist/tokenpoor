<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Agent quality operations pipeline</title>
<desc id="desc">A horizontal pipeline showing production traces feeding evaluation, recommendations, batch tests, A/B tests, approval, and monitored rollout.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
</defs>
<rect width="1200" height="560" fill="url(#bg)"/>
<text x="60" y="70" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">A minimal agent quality loop</text>
<text x="60" y="105" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">The important shift is from one-time prompt tuning to measured, approved change management.</text>
<g font-family="Inter, Arial, sans-serif">
  <g transform="translate(65,185)"><rect width="145" height="130" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#1e3a8a">Capture</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#1e40af">requests, tools,</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#1e40af">errors, outputs</text></g>
  <g transform="translate(245,185)"><rect width="145" height="130" rx="22" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#075985">Evaluate</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#075985">quality, safety,</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#075985">tool usage</text></g>
  <g transform="translate(425,185)"><rect width="145" height="130" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#5b21b6">Recommend</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#5b21b6">prompt and tool</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#5b21b6">description edits</text></g>
  <g transform="translate(605,185)"><rect width="145" height="130" rx="22" fill="#fae8ff" stroke="#d946ef" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#86198f">Batch test</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#86198f">known cases and</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#86198f">regressions</text></g>
  <g transform="translate(785,185)"><rect width="145" height="130" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#166534">A/B test</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#166534">compare against</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#166534">baseline</text></g>
  <g transform="translate(965,185)"><rect width="145" height="130" rx="22" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="72.5" y="54" text-anchor="middle" font-size="21" font-weight="800" fill="#9a3412">Approve</text><text x="72.5" y="84" text-anchor="middle" font-size="15" fill="#9a3412">ship only with</text><text x="72.5" y="105" text-anchor="middle" font-size="15" fill="#9a3412">evidence</text></g>
  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)"><line x1="218" y1="250" x2="237" y2="250"/><line x1="398" y1="250" x2="417" y2="250"/><line x1="578" y1="250" x2="597" y2="250"/><line x1="758" y1="250" x2="777" y2="250"/><line x1="938" y1="250" x2="957" y2="250"/></g>
</g>
<path d="M 1037 332 C 1037 430, 135 430, 135 332" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
<text x="470" y="470" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155">After rollout, traces feed the next measurement cycle.</text>
</svg>
