<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Agent quality optimization loop</title>
<desc id="desc">A production AI agent quality loop connecting traces, evaluations, recommendations, tests, approval, and rollout.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.95"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.95"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="1030" cy="90" r="180" fill="#38bdf8" opacity="0.10"/>
<circle cx="170" cy="590" r="230" fill="#a78bfa" opacity="0.12"/>
<text x="70" y="92" fill="#e0f2fe" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Agent quality drift</text>
<text x="70" y="132" fill="#bfdbfe" font-family="Inter, Arial, sans-serif" font-size="21">Production agents need an observe → evaluate → improve loop</text>
<g transform="translate(102,190)" filter="url(#shadow)">
  <circle cx="500" cy="210" r="178" fill="none" stroke="#93c5fd" stroke-width="8" stroke-dasharray="18 14" opacity="0.85"/>
  <g font-family="Inter, Arial, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <g transform="translate(500,20)"><rect x="-98" y="-36" width="196" height="72" rx="22" fill="url(#card)"/><text y="9" fill="#0f172a">Traces</text></g>
    <g transform="translate(710,150)"><rect x="-112" y="-36" width="224" height="72" rx="22" fill="url(#card)"/><text y="9" fill="#0f172a">Evaluate</text></g>
    <g transform="translate(635,385)"><rect x="-138" y="-36" width="276" height="72" rx="22" fill="url(#card)"/><text y="9" fill="#0f172a">Recommend</text></g>
    <g transform="translate(365,385)"><rect x="-112" y="-36" width="224" height="72" rx="22" fill="url(#card)"/><text y="9" fill="#0f172a">A/B test</text></g>
    <g transform="translate(290,150)"><rect x="-120" y="-36" width="240" height="72" rx="22" fill="url(#card)"/><text y="9" fill="#0f172a">Approve</text></g>
  </g>
  <g transform="translate(500,210)"><circle r="104" fill="#020617" opacity="0.82" stroke="#67e8f9" stroke-width="2"/><text y="-10" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" text-anchor="middle">AI agent</text><text y="28" fill="#c7d2fe" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">quality ops</text></g>
</g>
<text x="70" y="610" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="19">Do not just ship the prompt. Measure behavior, test changes, and approve rollout.</text>
</svg>
