<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw automation decision guide</title>
  <desc id="desc">A readable decision guide for choosing channels, heartbeat, cron, or ACP in OpenClaw.</desc>
  <rect width="800" height="620" fill="#0b1020"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">How to think about OpenClaw features</text>
  <text x="28" y="64" fill="#b8c1d9" font-family="Arial, sans-serif" font-size="14">Choose the tool by job shape, not by whichever feature sounds most advanced</text>

  <g font-family="Arial, sans-serif">
    <rect x="270" y="92" width="260" height="64" rx="14" fill="#16213f" stroke="#8aa4ff" stroke-width="2"/>
    <text x="400" y="119" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Start here</text>
    <text x="400" y="141" text-anchor="middle" fill="#dbe3f4" font-size="13">What problem are you solving?</text>

    <line x1="400" y1="156" x2="400" y2="186" stroke="#6f86c7" stroke-width="3"/>

    <rect x="38" y="196" width="170" height="96" rx="14" fill="#1b2a4d"/>
    <text x="123" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Need a place to talk?</text>
    <text x="123" y="246" text-anchor="middle" fill="#dbe3f4" font-size="13">Pick the channel you</text>
    <text x="123" y="264" text-anchor="middle" fill="#dbe3f4" font-size="13">already use most</text>

    <rect x="223" y="196" width="170" height="96" rx="14" fill="#18334a"/>
    <text x="308" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Need loose periodic work?</text>
    <text x="308" y="246" text-anchor="middle" fill="#dbe3f4" font-size="13">Batch checks, reminders,</text>
    <text x="308" y="264" text-anchor="middle" fill="#dbe3f4" font-size="13">or ambient follow-ups</text>

    <rect x="408" y="196" width="170" height="96" rx="14" fill="#33244b"/>
    <text x="493" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Need exact timing?</text>
    <text x="493" y="246" text-anchor="middle" fill="#dbe3f4" font-size="13">Run something at a</text>
    <text x="493" y="264" text-anchor="middle" fill="#dbe3f4" font-size="13">specific time or cadence</text>

    <rect x="593" y="196" width="170" height="96" rx="14" fill="#3a241a"/>
    <text x="678" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Need IDE integration?</text>
    <text x="678" y="246" text-anchor="middle" fill="#dbe3f4" font-size="13">Route editor prompts</text>
    <text x="678" y="264" text-anchor="middle" fill="#dbe3f4" font-size="13">into OpenClaw sessions</text>

    <line x1="123" y1="292" x2="123" y2="330" stroke="#6f86c7" stroke-width="3"/>
    <line x1="308" y1="292" x2="308" y2="330" stroke="#6f86c7" stroke-width="3"/>
    <line x1="493" y1="292" x2="493" y2="330" stroke="#6f86c7" stroke-width="3"/>
    <line x1="678" y1="292" x2="678" y2="330" stroke="#6f86c7" stroke-width="3"/>

    <rect x="38" y="330" width="170" height="122" rx="14" fill="#121a31" stroke="#8aa4ff" stroke-width="2"/>
    <text x="123" y="358" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use channels</text>
    <text x="123" y="382" text-anchor="middle" fill="#dbe3f4" font-size="13">Slack, Telegram,</text>
    <text x="123" y="400" text-anchor="middle" fill="#dbe3f4" font-size="13">WhatsApp, Discord,</text>
    <text x="123" y="418" text-anchor="middle" fill="#dbe3f4" font-size="13">Signal, WebChat, more</text>

    <rect x="223" y="330" width="170" height="122" rx="14" fill="#121a31" stroke="#79d0bd" stroke-width="2"/>
    <text x="308" y="358" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use heartbeat</text>
    <text x="308" y="382" text-anchor="middle" fill="#dbe3f4" font-size="13">Good when timing can drift</text>
    <text x="308" y="400" text-anchor="middle" fill="#dbe3f4" font-size="13">and small checks can batch</text>
    <text x="308" y="418" text-anchor="middle" fill="#dbe3f4" font-size="13">into one useful loop</text>

    <rect x="408" y="330" width="170" height="122" rx="14" fill="#121a31" stroke="#d1a7ff" stroke-width="2"/>
    <text x="493" y="358" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use cron</text>
    <text x="493" y="382" text-anchor="middle" fill="#dbe3f4" font-size="13">Best when exact timing</text>
    <text x="493" y="400" text-anchor="middle" fill="#dbe3f4" font-size="13">or strict isolation matters</text>
    <text x="493" y="418" text-anchor="middle" fill="#dbe3f4" font-size="13">for the task</text>

    <rect x="593" y="330" width="170" height="122" rx="14" fill="#121a31" stroke="#ffbf8a" stroke-width="2"/>
    <text x="678" y="358" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use ACP</text>
    <text x="678" y="382" text-anchor="middle" fill="#dbe3f4" font-size="13">Treat it as a bridge into</text>
    <text x="678" y="400" text-anchor="middle" fill="#dbe3f4" font-size="13">Gateway sessions, not</text>
    <text x="678" y="418" text-anchor="middle" fill="#dbe3f4" font-size="13">the whole product</text>

    <rect x="170" y="492" width="460" height="70" rx="12" fill="#18203a"/>
    <text x="400" y="520" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Practical rule</text>
    <text x="400" y="544" text-anchor="middle" fill="#dbe3f4" font-size="13">Start with one channel and one useful automation loop. Add ACP or nodes later.</text>
  </g>
</svg>
