<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">A production agent safety loop</title><desc id="desc">The path from a user request through policy, sandbox execution, evidence, and approval.</desc><rect width="1000" height="520" fill="#f8fafc"/><text x="500" y="55" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#0f172a">A Minimal Production Agent Loop</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><g font-family="Inter,Arial,sans-serif"><g fill="#ffffff" stroke="#cbd5e1" stroke-width="2"><rect x="55" y="150" width="140" height="82" rx="16"/><rect x="230" y="150" width="140" height="82" rx="16"/><rect x="405" y="150" width="140" height="82" rx="16"/><rect x="580" y="150" width="140" height="82" rx="16"/><rect x="755" y="150" width="190" height="82" rx="16"/><rect x="230" y="315" width="515" height="92" rx="18" fill="#eef2ff" stroke="#818cf8"/></g><g font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle"><text x="125" y="186">Request</text><text x="125" y="211">+ scope</text><text x="300" y="186">Policy</text><text x="300" y="211">decision</text><text x="475" y="186">Sandbox</text><text x="475" y="211">execution</text><text x="650" y="186">Evidence</text><text x="650" y="211">bundle</text><text x="850" y="186">Approve, retry,</text><text x="850" y="211">or stop</text><text x="488" y="358" font-size="22">Logs: identity, tool calls, commands, diffs, outputs</text><text x="488" y="389" font-size="17" font-weight="500" fill="#475569">Make every delegated action inspectable after the run.</text></g><g stroke="#334155" stroke-width="3" marker-end="url(#arrow)"><path d="M195 191H225"/><path d="M370 191H400"/><path d="M545 191H575"/><path d="M720 191H750"/><path d="M650 232v75"/><path d="M745 361c95 0 130-45 