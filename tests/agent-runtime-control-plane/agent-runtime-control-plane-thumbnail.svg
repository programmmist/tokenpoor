ll="#15803d"/><text x="600" y="540" text-anchor="middle">Scoped Identity</text></g><g stroke="#f8fafc" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"><path d="M300 136 C350 150 350 210 385 250"/><path d="M815 250 C850 210 850 150 900 136"/><path d="M385 380 C335 415 335 475 300 501"/><path d="M815 380 C865 415 865 475 900 501"/><path d="M600 435 V485"/></g><text x="600" y="75" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">Production Agents Need Runtime Boundaries</text></svg>