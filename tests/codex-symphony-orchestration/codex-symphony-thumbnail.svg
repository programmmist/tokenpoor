<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">OpenAI Symphony orchestration thumbnail</title><desc id="desc">A dark dashboard-style illustration showing an issue tracker controlling multiple coding agents and review handoffs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#16213e"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#243b55"/><stop offset="1" stop-color="#141e30"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter></defs><rect width="1200" height="675" fill="url(#bg)"/><circle cx="1020" cy="110" r="160" fill="#36d399" opacity="0.12"/><circle cx="170" cy="570" r="210" fill="#60a5fa" opacity="0.12"/><text x="72" y="105" fill="#e5f2ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="800">Symphony for Codex</text><text x="74" y="154" fill="#9cc7ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28">Issue tracker → bounded agents → human review</text><g filter="url(#shadow)"><rect x="72" y="215" width="300" height="310" rx="24" fill="url(#card)" stroke="#5da9ff" stroke-opacity="0.45"/><text x="105" y="270" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Backlog states</text><rect x="105" y="305" width="220" height="42" rx="13" fill="#1f9cf0" opacity="0.95"/><text x="128" y="334" fill="#fff" font-family="Arial" font-size="18">Ready for Agent</text><rect x="105" y="365" width="220" height="42" rx="13" fill="#7c3aed" opacity="0.95"/><text x="128" y="394" fill="#fff" font-family="Arial" font-size="18">Agent Working</text><rect x="105" y="425" width="220" height="42" rx="13" fill="#f59e0b" opacity="0.95"/><text x="128" y="454" fill="#111827" font-family="Arial" font-size="18" font-weight="700">Human Review</text></g><g stroke="#8bd3ff" stroke-width="6" stroke-linecap="round" opacity="0.8"><path d="M395 370 C465 370 470 330 540 330"/><path d="M395 370 C465 370 470 410 540 410"/><path d="M395 370 C465 370 470 490 540 490"/></g><g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="540" y="278" width="175" height="105" rx="22" fill="#112d4e" stroke="#36d399" stroke-opacity="0.7"/><text x="582" y="326" fill="#d1fae5" font-size="24" font-weight="800">Agent 1</text><text x="584" y="356" fill="#a7f3d0" font-size="17">workspace</text><rect x="540" y="398" width="175" height="105" rx="22" fill="#112d4e" stroke="#36d399" stroke-opacity="0.7"/><text x="582" y="446" fill="#d1fae5" font-size="24" font-weight="800">Agent 2</text><text x="584" y="476" fill="#a7f3d0" font-size="17">retryable</text><rect x="540" y="518" width="175" height="105" rx="22" fill="#112d4e" stroke="#36d399" stroke-opacity="0.7"/><text x="582" y="566" fill="#d1fae5" font-size="24" font-weight="800">Agent 3</text><text x="584" y="596" fill="#a7f3d0" font-size="17">bounded</text></g><path d="M735 445 C820 445 835 410 900 410" stroke="#8bd3ff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8"/><g filter="url(#shadow)"><rect x="900" y="325" width="230" height="170" rx="26" fill="#1f2937" stroke="#fbbf24" stroke-opacity="0.7"/><text x="940" y="390" fill="#fff7ed" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Review</text><text x="940" y="430" fill="#fed7aa" font-family="Arial" font-size="21">merge, revise,</text><text x="940" y="460" fill="#fed7aa" font-family="Arial" font-size="21">or stop safely</text></g></svg>
