<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Symphony-style coding agent workflow loop</title><desc id="desc">A step diagram: issue tracker, orchestrator, agent workspace, CI evidence, human review, and reconciliation back to the tracker.</desc><rect width="1200" height="720" fill="#f8fafc"/><text x="72" y="78" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="800">A Symphony-style agent loop</text><text x="74" y="116" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Keep the issue tracker authoritative; make every agent run bounded, observable, and reviewable.</text><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10" fill="#2563eb"/></marker></defs><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="70" y="190" width="230" height="120" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="105" y="240" fill="#1e3a8a" font-size="25" font-weight="800">1. Issue state</text><text x="105" y="274" fill="#1e40af" font-size="18">Ready for Agent</text><rect x="380" y="190" width="230" height="120" rx="22" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="415" y="240" fill="#4c1d95" font-size="25" font-weight="800">2. Orchestrator</text><text x="415" y="274" fill="#5b21b6" font-size="18">poll + dispatch limit</text><rect x="690" y="190" width="230" height="120" rx="22" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="725" y="240" fill="#14532d" font-size="25" font-weight="800">3. Workspace</text><text x="725" y="274" fill="#166534" font-size="18">branch, logs, retries</text><rect x="690" y="430" width="230" height="120" rx="22" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="725" y="480" fill="#7c2d12" font-size="25" font-weight="800">4. Evidence</text><text x="725" y="514" fill="#9a3412" font-size="18">tests + changed files</text><rect x="380" y="430" width="230" height="120" rx="22" fill="#fef9c3" stroke="#facc15" stroke-width="2"/><text x="415" y="480" fill="#713f12" font-size="25" font-weight="800">5. Review</text><text x="415" y="514" fill="#854d0e" font-size="18">merge / revise / block</text><rect x="70" y="430" width="230" height="120" rx="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="105" y="480" fill="#0f172a" font-size="25" font-weight="800">6. Reconcile</text><text x="105" y="514" fill="#334155" font-size="18">update tracker state</text></g><g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M302 250 H372"/><path d="M612 250 H682"/><path d="M805 315 V420"/><path d="M682 490 H620"/><path d="M372 490 H310"/><path d="M185 425 V320"/></g><text x="80" y="640" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Operational rule:</text><text x="260" y="640" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">more parallel agents only help when review, tests, and queue hygiene scale too.</text></svg>
