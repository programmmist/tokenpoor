<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Claude Opus 4.7 and Claude Design</title>
  <desc id="desc">A dark themed workflow graphic showing design to code continuity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101826"/>
      <stop offset="100%" stop-color="#1f2f4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb86c"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="24"/>
  <text x="56" y="84" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700">Claude gets earlier in the workflow</text>
  <text x="56" y="122" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="20">Opus 4.7 strengthens long-running coding work. Claude Design widens the entry point.</text>
  <rect x="56" y="188" width="188" height="138" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" fill="#dbeafe" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Idea</text>
  <text x="150" y="262" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="18">Prompt</text>
  <text x="150" y="288" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, -apple-system, sans-serif" font-size="18">Sketch</text>
  <rect x="306" y="160" width="188" height="166" rx="18" fill="#3f1d2e" stroke="#f472b6" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" fill="#fce7f3" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Claude Design</text>
  <text x="400" y="238" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="18">Prototype</text>
  <text x="400" y="264" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="18">Mockup</text>
  <text x="400" y="290" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="18">Slides</text>
  <rect x="556" y="188" width="188" height="138" rx="18" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/>
  <text x="650" y="228" text-anchor="middle" fill="#d1fae5" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">Claude Code</text>
  <text x="650" y="262" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="18">Implement</text>
  <text x="650" y="288" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="18">Iterate</text>
  <path d="M244 257 C272 257, 280 243, 306 243" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <path d="M494 243 C522 243, 530 257, 556 257" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="281" cy="250" r="6" fill="#fed7aa"/>
  <circle cx="529" cy="250" r="6" fill="#bae6fd"/>
  <text x="56" y="392" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18">April 16, 2026: Opus 4.7. April 17, 2026: Claude Design.</text>
  <text x="56" y="418" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16">The bigger signal is continuity from concept to implementation.</text>
</svg>
