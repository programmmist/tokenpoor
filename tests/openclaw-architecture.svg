<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw gateway architecture</title>
  <desc id="desc">A readable architecture diagram showing the OpenClaw Gateway in the center, channels on the left, and clients, nodes, and automation on the right.</desc>
  <rect width="800" height="560" fill="#0b1020"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">OpenClaw in one diagram</text>
  <text x="28" y="64" fill="#b8c1d9" font-family="Arial, sans-serif" font-size="14">The Gateway is the center. Channels, clients, nodes, and automation connect through it.</text>

  <g font-family="Arial, sans-serif">
    <rect x="290" y="180" width="220" height="110" rx="18" fill="#16213f" stroke="#8aa4ff" stroke-width="2"/>
    <text x="400" y="214" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">OpenClaw Gateway</text>
    <text x="400" y="238" text-anchor="middle" fill="#dbe3f4" font-size="13">Owns messaging surfaces</text>
    <text x="400" y="256" text-anchor="middle" fill="#dbe3f4" font-size="13">Maintains sessions and routes</text>
    <text x="400" y="274" text-anchor="middle" fill="#dbe3f4" font-size="13">Accepts clients and nodes</text>

    <rect x="36" y="108" width="180" height="64" rx="14" fill="#1b2a4d"/>
    <text x="126" y="136" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Chat channels</text>
    <text x="126" y="158" text-anchor="middle" fill="#dbe3f4" font-size="13">Slack, Telegram, WhatsApp</text>

    <rect x="36" y="196" width="180" height="64" rx="14" fill="#1b2a4d"/>
    <text x="126" y="224" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">More channels</text>
    <text x="126" y="246" text-anchor="middle" fill="#dbe3f4" font-size="13">Discord, Signal, WebChat</text>

    <rect x="36" y="284" width="180" height="64" rx="14" fill="#1b2a4d"/>
    <text x="126" y="312" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Presence surface</text>
    <text x="126" y="334" text-anchor="middle" fill="#dbe3f4" font-size="13">One assistant, many chats</text>

    <rect x="584" y="94" width="180" height="64" rx="14" fill="#18334a"/>
    <text x="674" y="122" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Clients</text>
    <text x="674" y="144" text-anchor="middle" fill="#dbe3f4" font-size="13">CLI, web UI, automations</text>

    <rect x="584" y="182" width="180" height="64" rx="14" fill="#18334a"/>
    <text x="674" y="210" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Nodes</text>
    <text x="674" y="232" text-anchor="middle" fill="#dbe3f4" font-size="13">Devices and remote actions</text>

    <rect x="584" y="270" width="180" height="64" rx="14" fill="#18334a"/>
    <text x="674" y="298" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Automation</text>
    <text x="674" y="320" text-anchor="middle" fill="#dbe3f4" font-size="13">Heartbeat, cron, hooks, tasks</text>

    <rect x="584" y="358" width="180" height="64" rx="14" fill="#18334a"/>
    <text x="674" y="386" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ACP bridge</text>
    <text x="674" y="408" text-anchor="middle" fill="#dbe3f4" font-size="13">Routes IDE prompts into sessions</text>

    <line x1="216" y1="140" x2="290" y2="205" stroke="#6f86c7" stroke-width="3"/>
    <line x1="216" y1="228" x2="290" y2="228" stroke="#6f86c7" stroke-width="3"/>
    <line x1="216" y1="316" x2="290" y2="255" stroke="#6f86c7" stroke-width="3"/>

    <line x1="510" y1="214" x2="584" y2="126" stroke="#6f86c7" stroke-width="3"/>
    <line x1="510" y1="228" x2="584" y2="214" stroke="#6f86c7" stroke-width="3"/>
    <line x1="510" y1="242" x2="584" y2="302" stroke="#6f86c7" stroke-width="3"/>
    <line x1="510" y1="256" x2="584" y2="390" stroke="#6f86c7" stroke-width="3"/>

    <rect x="168" y="462" width="464" height="58" rx="12" fill="#18203a"/>
    <text x="400" y="488" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Mental model</text>
    <text x="400" y="510" text-anchor="middle" fill="#dbe3f4" font-size="13">OpenClaw is easier to understand when you treat the Gateway as the operational center.</text>
  </g>
</svg>
