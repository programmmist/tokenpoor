<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Teams vs subagents decision guide</title>
  <desc id="desc">A readable decision guide for when to use Claude Code Agent Teams and when to use subagents.</desc>
  <rect width="800" height="620" fill="#0b1020"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">When to use Agent Teams, and when to use subagents</text>
  <text x="28" y="64" fill="#b8c1d9" font-family="Arial, sans-serif" font-size="14">The practical split is coordination vs bounded context-heavy work</text>

  <g font-family="Arial, sans-serif">
    <rect x="270" y="92" width="260" height="64" rx="14" fill="#16213f" stroke="#8aa4ff" stroke-width="2"/>
    <text x="400" y="119" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">Start here</text>
    <text x="400" y="141" text-anchor="middle" fill="#dbe3f4" font-size="13">What kind of work are you delegating?</text>

    <line x1="400" y1="156" x2="400" y2="188" stroke="#6f86c7" stroke-width="3"/>

    <rect x="54" y="198" width="210" height="108" rx="14" fill="#1b2a4d"/>
    <text x="159" y="228" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use Agent Teams</text>
    <text x="159" y="252" text-anchor="middle" fill="#dbe3f4" font-size="13">The job has real phases</text>
    <text x="159" y="270" text-anchor="middle" fill="#dbe3f4" font-size="13">Planning and implementation</text>
    <text x="159" y="288" text-anchor="middle" fill="#dbe3f4" font-size="13">need visible handoffs</text>

    <rect x="536" y="198" width="210" height="108" rx="14" fill="#18334a"/>
    <text x="641" y="228" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Use subagents</text>
    <text x="641" y="252" text-anchor="middle" fill="#dbe3f4" font-size="13">The task is narrow but</text>
    <text x="641" y="270" text-anchor="middle" fill="#dbe3f4" font-size="13">context-heavy or exploratory</text>
    <text x="641" y="288" text-anchor="middle" fill="#dbe3f4" font-size="13">and should stay isolated</text>

    <line x1="159" y1="306" x2="159" y2="346" stroke="#6f86c7" stroke-width="3"/>
    <line x1="641" y1="306" x2="641" y2="346" stroke="#6f86c7" stroke-width="3"/>

    <rect x="54" y="346" width="210" height="126" rx="14" fill="#121a31" stroke="#8aa4ff" stroke-width="2"/>
    <text x="159" y="374" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Good Agent Team jobs</text>
    <text x="159" y="398" text-anchor="middle" fill="#dbe3f4" font-size="13">Feature planning</text>
    <text x="159" y="416" text-anchor="middle" fill="#dbe3f4" font-size="13">Implementation + review</text>
    <text x="159" y="434" text-anchor="middle" fill="#dbe3f4" font-size="13">Testing as a separate phase</text>

    <rect x="536" y="346" width="210" height="126" rx="14" fill="#121a31" stroke="#79d0bd" stroke-width="2"/>
    <text x="641" y="374" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Good subagent jobs</text>
    <text x="641" y="398" text-anchor="middle" fill="#dbe3f4" font-size="13">Repo exploration</text>
    <text x="641" y="416" text-anchor="middle" fill="#dbe3f4" font-size="13">Focused debugging</text>
    <text x="641" y="434" text-anchor="middle" fill="#dbe3f4" font-size="13">Narrow code review</text>

    <rect x="220" y="520" width="360" height="56" rx="12" fill="#18203a"/>
    <text x="400" y="546" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Never skip verification</text>
    <text x="400" y="566" text-anchor="middle" fill="#dbe3f4" font-size="13">Delegation only helps if one role is responsible for checking the result.</text>
  </g>
</svg>
