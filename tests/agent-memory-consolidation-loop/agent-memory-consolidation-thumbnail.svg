<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Agent memory consolidation</title>
<desc id="desc">Past agent runs flow into a governed memory loop, producing safer future behavior.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020617" flood-opacity="0.45"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="985" cy="105" r="150" fill="#38bdf8" opacity="0.08"/>
<circle cx="130" cy="600" r="210" fill="#a78bfa" opacity="0.10"/>
<text x="70" y="90" fill="#c4b5fd" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4">TOKEN POOR</text>
<text x="70" y="175" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">Agent Memory</text>
<text x="70" y="245" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800">Consolidation</text>
<text x="72" y="305" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">The next infrastructure primitive is not</text>
<text x="72" y="342" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">longer context. It is governed learning.</text>
<g transform="translate(650 155)" filter="url(#shadow)">
  <rect x="0" y="0" width="420" height="360" rx="32" fill="#0b1220" stroke="#475569" stroke-width="2"/>
  <circle cx="210" cy="175" r="82" fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
  <path d="M210 70 A105 105 0 0 1 315 175" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <path d="M210 280 A105 105 0 0 1 105 175" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/>
  <rect x="44" y="42" width="130" height="48" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <text x="64" y="73" fill="#e0f2fe" font-family="Inter, Arial" font-size="18" font-weight="700">RUN LOGS</text>
  <rect x="246" y="42" width="130" height="48" rx="14" fill="#1e293b" stroke="#a78bfa"/>
  <text x="274" y="73" fill="#ede9fe" font-family="Inter, Arial" font-size="18" font-weight="700">EVALS</text>
  <rect x="54" y="270" width="142" height="48" rx="14" fill="#1e293b" stroke="#22c55e"/>
  <text x="76" y="301" fill="#dcfce7" font-family="Inter, Arial" font-size="18" font-weight="700">MEMORY</text>
  <rect x="238" y="270" width="142" height="48" rx="14" fill="#1e293b" stroke="#f59e0b"/>
  <text x="263" y="301" fill="#fef3c7" font-family="Inter, Arial" font-size="18" font-weight="700">FUTURE</text>
  <text x="154" y="184" fill="#ffffff" font-family="Inter, Arial" font-size="28" font-weight="800">review</text>
  <text x="147" y="218" fill="#cbd5e1" font-family="Inter, Arial" font-size="20">promote</text>
</g>
<line x1="70" y1="560" x2="1070" y2="560" stroke="#64748b" stroke-width="2" opacity="0.5"/>
<text x="70" y="610" fill="#e2e8f0" font-family="Inter, Arial" font-size="25">Run evidence → candidate lessons → review → scoped memory → safer future runs</text>
</svg>
