<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
  <title id="title">AI model update comparison</title>
  <desc id="desc">A readable comparison chart covering OpenAI GPT-5.4, Claude Sonnet 4.6, Gemini 3.1 Pro and Flash Live, and Grok 4.20.</desc>
  <rect width="800" height="620" fill="#0b1020"/>
  <text x="28" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Spring 2026 AI model updates at a glance</text>
  <text x="28" y="64" fill="#b8c1d9" font-family="Arial, sans-serif" font-size="14">Readable comparison for builders choosing among major model families</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#dbe3f4">
    <rect x="20" y="92" width="760" height="46" rx="10" fill="#121a31"/>
    <text x="40" y="120" font-size="13" font-weight="700">Model</text>
    <text x="205" y="120" font-size="13" font-weight="700">What changed</text>
    <text x="425" y="120" font-size="13" font-weight="700">Best fit</text>
    <text x="615" y="120" font-size="13" font-weight="700">Watch-out</text>

    <rect x="20" y="150" width="760" height="100" rx="12" fill="#16213f"/>
    <text x="40" y="176" fill="#ffffff" font-size="15" font-weight="700">OpenAI GPT-5.4</text>
    <text x="40" y="196" fill="#9fb3ff">Mar 5, 2026</text>
    <text x="205" y="176">Professional-work focus</text>
    <text x="205" y="194">Docs and spreadsheets</text>
    <text x="205" y="212">Coding and agent tasks</text>
    <text x="425" y="176">Internal work assistants</text>
    <text x="425" y="194">Ops and productivity tools</text>
    <text x="425" y="212">Document-heavy workflows</text>
    <text x="615" y="176">Premium pricing</text>
    <text x="615" y="194">Ecosystem dependence</text>
    <text x="615" y="212">Needs real workflow testing</text>

    <rect x="20" y="262" width="760" height="100" rx="12" fill="#13273a"/>
    <text x="40" y="288" fill="#ffffff" font-size="15" font-weight="700">Claude Sonnet 4.6</text>
    <text x="40" y="308" fill="#86d8c5">Feb 17, 2026</text>
    <text x="205" y="288">Better coding support</text>
    <text x="205" y="306">Planning and design work</text>
    <text x="205" y="324">Long-context default story</text>
    <text x="425" y="288">Coding copilots</text>
    <text x="425" y="306">Structured writing</text>
    <text x="425" y="324">Planning and research flows</text>
    <text x="615" y="288">Less flashy marketing</text>
    <text x="615" y="306">Easy to underrate</text>
    <text x="615" y="324">Still test with your prompts</text>

    <rect x="20" y="374" width="760" height="112" rx="12" fill="#2a1f3d"/>
    <text x="40" y="400" fill="#ffffff" font-size="15" font-weight="700">Gemini 3.1 Pro / Flash Live</text>
    <text x="40" y="420" fill="#d1a7ff">Pro: Feb 19  |  Flash Live: Mar 26</text>
    <text x="205" y="400">Google split the lineup</text>
    <text x="205" y="418">Pro for deep synthesis</text>
    <text x="205" y="436">Flash Live for real-time voice</text>
    <text x="425" y="400">Hard reasoning tasks</text>
    <text x="425" y="418">Multimodal voice products</text>
    <text x="425" y="436">Google-native stacks</text>
    <text x="615" y="400">Do not treat both modes</text>
    <text x="615" y="418">as one product decision</text>
    <text x="615" y="436">Latency needs are different</text>

    <rect x="20" y="498" width="760" height="100" rx="12" fill="#3a241a"/>
    <text x="40" y="524" fill="#ffffff" font-size="15" font-weight="700">xAI Grok 4.20</text>
    <text x="40" y="544" fill="#ffbf8a">Flagship in docs, April 2026</text>
    <text x="205" y="524">Long-context positioning</text>
    <text x="205" y="542">Tool-use emphasis</text>
    <text x="205" y="560">Aggressive price-performance</text>
    <text x="425" y="524">Large-input workflows</text>
    <text x="425" y="542">Retrieval-heavy systems</text>
    <text x="425" y="560">Tool-calling evaluation</text>
    <text x="615" y="524">Long context is not enough</text>
    <text x="615" y="542">Check reliability and latency</text>
    <text x="615" y="560">Benchmark claims are not ops</text>
  </g>
</svg>
