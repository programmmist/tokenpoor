<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Enterprise agents as operating model infrastructure</title>
<desc id="desc">A governed enterprise agent sits between people, tools, schedules, and controls.</desc>
<rect width="1200" height="630" fill="#07111f"/>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<circle cx="985" cy="120" r="210" fill="#12345d" opacity="0.45"/>
<circle cx="150" cy="565" r="220" fill="#0f766e" opacity="0.28"/>
<rect x="120" y="95" width="960" height="440" rx="34" fill="#0d1b2d" stroke="#25415f" stroke-width="2" filter="url(#shadow)"/>
<text x="150" y="165" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">Enterprise agents are becoming</text>
<text x="150" y="215" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="900" fill="#7dd3fc">operating-model infrastructure</text>
<g transform="translate(165 280)">
  <rect width="205" height="95" rx="18" fill="#10243a" stroke="#38bdf8"/>
  <text x="102" y="42" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#e0f2fe">People</text>
  <text x="102" y="69" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#93c5fd">direct & approve</text>
</g>
<g transform="translate(498 255)">
  <rect width="205" height="145" rx="24" fill="url(#g)"/>
  <text x="102" y="57" text-anchor="middle" font-family="Inter,Arial" font-size="25" font-weight="900" fill="white">Agent</text>
  <text x="102" y="88" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#e0f2fe">scheduled · connected</text>
  <text x="102" y="114" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#e0f2fe">observable · versioned</text>
</g>
<g transform="translate(830 280)">
  <rect width="205" height="95" rx="18" fill="#10243a" stroke="#2dd4bf"/>
  <text x="102" y="42" text-anchor="middle" font-family="Inter,Arial" font-size="20" font-weight="700" fill="#ccfbf1">Tools</text>
  <text x="102" y="69" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#99f6e4">files · apps · MCP</text>
</g>
<path d="M375 327 H485" stroke="#94a3b8" stroke-width="5" marker-end="url(#m)"/>
<path d="M713 327 H822" stroke="#94a3b8" stroke-width="5" marker-end="url(#m)"/>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
<g font-family="Inter,Arial" font-size="16" fill="#cbd5e1">
  <text x="150" y="462">Control plane: identity · permissions · credentials · logs · review gates · evaluation</text>
</g>
</svg>
