<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Central sandbox with one blocked internet path and two approved capability paths">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111629"/>
      <stop offset="100%" stop-color="#1a1333"/>
    </linearGradient>
    <linearGradient id="sandboxGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61e7ff"/>
      <stop offset="100%" stop-color="#8d6bff"/>
