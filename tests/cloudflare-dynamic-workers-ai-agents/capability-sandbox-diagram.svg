<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Worker sandbox boundary</title>
  <desc id="desc">Simple diagram showing user request and model code entering a Dynamic Worker sandbox. General internet is blocked. Only bound capabilities are allowed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7dd3fc"/></marker>
    <style>
      .bg{fill:#111827}.box{fill:#172554;stroke:#60a5fa;stroke-width:2.5}.panel{fill:#1f2937;stroke:#94a3b8;stroke-width:2}.allow{fill:#14302a;stroke:#34d399;stroke-width:2.5}.txt{fill:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;font-size:18px;font-weight:600}.sub{fill:#cbd5e1;font-family:system-ui,-apple-system,sans-serif;font-size:16px}.head{fill:#f8fafc;font-family:system-ui,-apple-system,sans-serif;font-size:23px;font-weight:700}.line{stroke:#7dd3fc;stroke-width:3;fill:none;marker-end:url(#arrow)}.rail{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}.block{stroke:#fb7185;stroke-width:5;fill:none}.red{fill:#fb7185;font-family:system-ui,-apple-system,sans-serif;font-size:18px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="800" height="420" rx="18"/>
  <text class="head" x="28" y="38">Default block, explicit allow</text>

  <rect class="box" x="30" y="138" width="140" height="70" rx="12"/>
  <text class="txt" x="100" y="168" text-anchor="middle">User request</text>
  <text class="sub" x="100" y="189" text-anchor="middle">task + intent</text>

  <rect class="box" x="205" y="138" width="145" height="70" rx="12"/>
  <text class="txt" x="277" y="168" text-anchor="middle">Model</text>
  <text class="sub" x="277" y="189" text-anchor="middle">writes code</text>

  <rect class="rail" x="390" y="88" width="180" height="174" rx="18"/>
  <text class="txt" x="480" y="116" text-anchor="middle">Dynamic Worker</text>
  <rect class="panel" x="415" y="146" width="130" height="56" rx="12"/>
  <text class="txt" x="480" y="179" text-anchor="middle">Code runs here</text>

  <path class="line" d="M170 173 H205"/>
  <path class="line" d="M350 173 H415"/>

  <circle cx="650" cy="128" r="42" fill="#1f2937" stroke="#64748b" stroke-width="2"/>
  <text class="sub" x="650" y="122" text-anchor="middle">Open</text>
  <text class="sub" x="650" y="142" text-anchor="middle">internet</text>
  <line class="block" x1="620" y1="98" x2="680" y2="158"/>
  <line class="block" x1="680" y1="98" x2="620" y2="158"/>
  <text class="red" x="650" y="188" text-anchor="middle">Blocked by default</text>
  <path d="M545 173 C580 160, 595 150, 608 142" stroke="#fb7185" stroke-width="4" fill="none"/>

  <rect class="allow" x="610" y="238" width="160" height="116" rx="14"/>
  <text class="txt" x="690" y="267" text-anchor="middle">Only bound</text>
  <text class="txt" x="690" y="289" text-anchor="middle">capabilities</text>
  <text class="sub" x="690" y="315" text-anchor="middle">sendEmail</text>
  <text class="sub" x="690" y="336" text-anchor="middle">createTicket</text>
  <path class="line" d="M545 190 C590 205, 598 235, 610 248"/>

  <rect class="panel" x="60" y="308" width="180" height="56" rx="12"/>
  <text class="txt" x="150" y="342" text-anchor="middle">Secrets stay outside</text>
  <rect class="panel" x="285" y="308" width="180" height="56" rx="12"/>
  <text class="txt" x="375" y="342" text-anchor="middle">State stays outside</text>
</svg>
